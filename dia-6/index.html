<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Layout</title>
  <link rel="stylesheet" href="./output.css">
</head>
<body class="flex flex-col h-screen">


  <header class="h-[16%] bg-slate-700 flex items-center justify-center font-bold text-white">
    Mi Tiendita

  <nav class="h-[8%] bg-cyan-500 flex items-center justify-center font-bold text-white">
    Barra de navegación
  </nav>

  
  <main class="h-[70%] flex font-bold">
    <section class="w-[70%] bg-gray-300 flex flex-col items-center justify-center p-4">

        <img src="https://http2.mlstatic.com/D_NQ_NP_641315-MLU78583705471_082024-O.webp" alt="itachi funko">

</main>

    <aside class="bg-gray-800 flex items-center justify-center font-bold">

    Footer
    <button class="mt-2 px-4 py-2 bg-cyan-500 hover:bg-cyan-600 rounded text-black font-bold">
