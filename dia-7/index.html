<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./output.css">
  <title>Formulario de práctica</title>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="bg-white p-6 rounded-xl w-80">
    <h2 class="text-xl font-bold text-center mb-4">Formulario</h2>

    <label class="block mb-2 text-gray-700">Nombre</label>
    <input type="text" placeholder="Ingresa tu nombre"
      class="w-full px-3 py-2 mb-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-400">

    <label class="block mb-2 text-gray-700">Contraseña</label>
    <input type="password" placeholder="Contraseña"
      class="w-full px-3 py-2 mb-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-400">

    <button
      class="w-full bg-sky-500 text-white py-2 rounded-lg font-semibold hover:bg-sky-600 transition-colors">
      Enviar
    </button>
  </div>

</body>
</html>
