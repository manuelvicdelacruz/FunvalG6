<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Epic Games</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
  <div class="logo">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/31/Epic_Games_logo.svg" alt="Epic Games Logo">
  </div>

 <div class="social-buttons">
  <a href="#" title="Facebook">
    <img src="https://cdn-icons-png.flaticon.com/512/145/145802.png" alt="Facebook"/>
  </a>
  <a href="#" title="Google">
    <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Google"/>
  </a>
  <a href="#" title="PlayStation">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Xbox_one_logo.svg/2048px-Xbox_one_logo.svg.png" alt="Xbox"/>
  </a>
  <a href="#" title="Xbox">
    <img src="https://cdn.hobbyconsolas.com/sites/navi.axelspringer.es/public/media/image/2020/01/ps-logo.jpg?tf=1200x1200"alt="PlayStation"/>
  </a>
  <a href="#" title="Nintendo Switch">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f0/Nintendo_Switch_logo.svg/512px-Nintendo_Switch_logo.svg.png" alt="Nintendo Switch"/>
  </a>
</div>
  <form>
    <select>
      <option selected>Pais</option>
      <option>Chile</option>
      <option>Republica Dominicana</option>
      <option>Ecuador</option>
      <option>U.S</option>
      <option>Chile</option>
      <option>México</option>
      <option>Colombia</option>
    </select>

    <input type="text" placeholder="*Nombre">
    <input type="text" placeholder="*Apellidos">
    <input type="text" placeholder="*Nombre de usuario">
    <input type="email" placeholder="*Dirección de correo electrónico">
    <input type="password" placeholder="*Contraseña">

    <div class="checkbox">
      <input type="checkbox" id="news">
      <label for="news">Me gustaría recibir noticias, encuestas y ofertas especiales de Epic Games.</label>
    </div>

    <div class="checkbox">
      <input type="checkbox" id="terms">
      <label for="terms">He leído y acepto los <a href="#">términos de servicio</a></label>
    </div>

    <button class="create-btn" disabled>CREAR CUENTA</button>
  </form>

  <div class="footer-links">
    <a href="#">Política de privacidad</a><br><br>
    ¿Tienes una cuenta de Epic Games? <a href="#">Iniciar sesión</a>
  </div>
</div>

</body>
</html>
